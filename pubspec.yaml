name: neotask_pro
description: "NeoTask - Manager & Employee Task Management Platform"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  http: 1.5.0
  intl: ^0.20.2
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.4
  firebase_core: 3.6.0
  cloud_firestore: 5.4.3
  firebase_auth: 5.3.1
  cloud_functions: 5.1.3
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0
  record: ^5.2.1
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/neotask_logo.png
    - assets/images/neotask_logo_full.png
    - assets/images/login_bg.jpg
