<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NeoTask - Manager & Employee Task Management Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NeoTask">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>NeoTask</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    #boot-status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      color: #1B3A6B;
      background: #f5f7fa;
      z-index: 9999;
    }
    #boot-status img {
      width: 92px;
      height: 92px;
      object-fit: contain;
    }
    #boot-status .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(27, 58, 107, 0.18);
      border-top-color: #1B3A6B;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #boot-message {
      font-size: 15px;
      font-weight: 600;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-status" role="status" aria-live="polite">
    <img src="assets/assets/images/neotask_logo.png" alt="NeoTask">
    <div class="spinner"></div>
    <div id="boot-message">جارٍ تشغيل NeoTask</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const status = document.getElementById('boot-status');
      if (status) status.remove();
    });

    window.addEventListener('error', function (event) {
      const message = document.getElementById('boot-message');
      if (message) message.textContent = 'تعذّر تحميل التطبيق، أعد فتح الصفحة';
      console.error('NeoTask startup error:', event.error || event.message);
    });

    setTimeout(function () {
      const message = document.getElementById('boot-message');
      if (message && document.getElementById('boot-status')) {
        message.textContent = 'استغرق التشغيل وقتًا أطول من المتوقع';
      }
    }, 20000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
