<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NeoTask - Manager & Employee Task Management Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NeoTask">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NeoTask</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Self-hosted Firebase JS SDK modules (SAME-ORIGIN, not gstatic.com CDN).

    Root cause this addresses: firebase_core_web (the Dart plugin) normally
    fetches these modules dynamically at runtime from
    https://www.gstatic.com/firebasejs/... via an inline-script +
    async import() trigger. Some institutional/corporate networks and mobile
    browser security policies (observed: hospital-managed device, iOS Safari,
    reported by multiple users) block that third-party gstatic.com fetch or
    the dynamically-created inline <script> pattern, even though the rest of
    the page (served from this same web.app origin) loads fine. When that
    fetch is blocked or hangs, FlutterFire surfaces
    PlatformException(channel-error, "Unable to establish connection on
    channel"), which looks like a login/credential failure but actually
    happens before any credential is sent to Firebase's servers.

    Fix: the 3 required SDK files (app/auth/firestore) are vendored into
    web/firebase-sdk/ and served from THIS origin (web.app), with their
    internal cross-import of firebase-app.js rewritten to a relative path.
    Pre-populating window.firebase_core / window.firebase_auth /
    window.firebase_firestore here makes firebase_core_web's
    _initializeCore() short-circuit (see its check:
    `if (globalContext['firebase_core'] != null) return;`), so it never
    attempts the gstatic.com dynamic injection at all.

    Version pinned: 11.9.1, matching firebase_core_web 2.24.0's
    `supportedFirebaseJsSdkVersion` constant exactly (verified in
    pubspec.lock). If firebase_core_web is ever upgraded, the files in
    web/firebase-sdk/ must be re-fetched and re-vendored at the new version.
  -->
  <script type="module">
    window.firebase_core = await import("./firebase-sdk/firebase-app.js");
    window.firebase_auth = await import("./firebase-sdk/firebase-auth.js");
    window.firebase_firestore = await import("./firebase-sdk/firebase-firestore.js");
  </script>

  <!--
    PWA UPDATE-DETECTION FIX (added after a live-deploy diagnosis: a new
    feature was confirmed present on the server, byte-identical between
    local build and the live site, yet a logged-in manager's device kept
    showing the OLD app — because Flutter's generated
    flutter_service_worker.js already calls self.skipWaiting() +
    self.clients.claim() on install/activate, but a browser only checks
    for a NEW service worker file on its own schedule (roughly every 24h)
    unless a page explicitly asks it to. An already-open tab (or an
    installed PWA that's never fully closed) can therefore keep running a
    stale cached bundle indefinitely with no visible error.

    Fix, in two parts:
      1. On load AND periodically while the tab stays open, explicitly
         call registration.update() to force the browser to re-fetch
         flutter_service_worker.js and notice a new deploy promptly
         instead of waiting for its own internal schedule.
      2. Once a new service worker actually takes over this page
         (the 'controllerchange' event — which only fires on an UPDATE,
         never on first install, since there is no previous controller to
         change from), reload once automatically so the new version is
         picked up without the user needing to manually clear site data.
         The `refreshing` guard prevents a reload loop if the browser
         fires this event more than once.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      const checkForUpdate = () => {
        navigator.serviceWorker.getRegistration().then((reg) => {
          if (reg) reg.update();
        });
      };

      window.addEventListener('load', () => {
        checkForUpdate();
        // Re-check whenever the tab regains focus/visibility, and on a
        // 60s interval while it stays open/visible — covers both the
        // "left the tab open all day" and the "switched back to it"
        // cases without depending on the browser's own ~24h SW check.
        setInterval(() => {
          if (document.visibilityState === 'visible') checkForUpdate();
        }, 60000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') checkForUpdate();
        });
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
