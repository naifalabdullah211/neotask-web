<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NeoTask - Manager & Employee Task Management Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NeoTask">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preload" as="image" href="assets/assets/images/neotask_logo_full.png">

  <title>NeoTask</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    #boot-status {
      position: fixed;
      inset: 0;
      color: #1B3A6B;
      background: #f6f8fb;
      z-index: 9999;
    }
    .boot-shell {
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(420px, 56%) minmax(360px, 44%);
      direction: ltr;
    }
    .boot-form-side {
      display: grid;
      place-items: center;
      padding: 40px;
      direction: rtl;
    }
    .boot-card {
      width: min(100%, 430px);
      box-sizing: border-box;
      padding: 34px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(17, 37, 68, .12);
    }
    .boot-card img {
      display: block;
      width: 190px;
      height: 76px;
      object-fit: contain;
      margin: 0 auto 26px;
    }
    .boot-title {
      margin: 0 0 7px;
      color: #112946;
      font-size: 25px;
      font-weight: 800;
      text-align: center;
    }
    .boot-subtitle {
      margin: 0 0 25px;
      color: #718096;
      font-size: 14px;
      text-align: center;
    }
    .boot-label {
      display: block;
      margin: 0 3px 7px;
      color: #506176;
      font-size: 12px;
      font-weight: 700;
    }
    .boot-field {
      height: 50px;
      margin-bottom: 16px;
      border: 1px solid #dce3ea;
      border-radius: 13px;
      background: #f9fbfc;
    }
    .boot-action {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 7px;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #15355c, #315c79);
      font-size: 14px;
      font-weight: 800;
    }
    .boot-secure {
      margin: 16px 0 0;
      color: #7a8796;
      font-size: 11px;
      text-align: center;
    }
    .boot-brand-side {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 64px;
      color: #fff;
      background: linear-gradient(145deg, #0f2948 0%, #163a61 68%, #214c69 100%);
      direction: rtl;
    }
    .boot-brand-side::before {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      left: -170px;
      bottom: -170px;
      border-radius: 50%;
      background: rgba(111, 215, 190, .16);
    }
    .boot-brand-copy { position: relative; max-width: 440px; }
    .boot-brand-copy h1 {
      margin: 0 0 14px;
      font-size: clamp(29px, 3vw, 46px);
      line-height: 1.35;
    }
    .boot-brand-copy p {
      margin: 0;
      color: rgba(255,255,255,.74);
      font-size: 16px;
      line-height: 1.8;
    }
    #boot-status .spinner {
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #boot-message { font: inherit; }
    #boot-retry {
      display: none;
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      padding: 11px 22px;
      color: #fff;
      background: #1B3A6B;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 899px) {
      #boot-status { overflow: auto; }
      .boot-shell {
        min-height: 100%;
        grid-template-columns: 1fr;
        grid-template-rows: 210px auto;
      }
      .boot-brand-side {
        grid-row: 1;
        justify-content: center;
        padding: 30px 24px 54px;
        text-align: center;
      }
      .boot-brand-copy h1 { font-size: 25px; }
      .boot-brand-copy p { font-size: 13px; }
      .boot-form-side {
        grid-row: 2;
        place-items: start center;
        padding: 0 18px 30px;
      }
      .boot-card {
        margin-top: -34px;
        padding: 27px 22px;
        border-radius: 23px;
      }
      .boot-card img { width: 170px; height: 66px; margin-bottom: 18px; }
      .boot-title { font-size: 22px; }
    }
    @media (max-height: 650px) and (max-width: 899px) {
      .boot-shell { grid-template-rows: 150px auto; }
      .boot-brand-side { padding-top: 22px; }
      .boot-brand-copy p { display: none; }
      .boot-card { padding-block: 20px; }
      .boot-card img { height: 52px; margin-bottom: 10px; }
      .boot-subtitle { margin-bottom: 15px; }
      .boot-field { height: 44px; margin-bottom: 10px; }
      .boot-action { height: 44px; }
      .boot-secure { margin-top: 10px; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-status" role="status" aria-live="polite" aria-busy="true">
    <div class="boot-shell">
      <main class="boot-form-side">
        <section class="boot-card">
          <img src="assets/assets/images/neotask_logo_full.png?v=20260801-5" alt="NeoTask">
          <h2 class="boot-title">مرحبًا بعودتك</h2>
          <p class="boot-subtitle">سجّل الدخول للوصول إلى مساحة عملك</p>
          <span class="boot-label">الرقم الوظيفي</span>
          <div class="boot-field"></div>
          <span class="boot-label">الرقم السري</span>
          <div class="boot-field"></div>
          <div class="boot-action"><span class="spinner"></span><span id="boot-message">جارٍ تجهيز تسجيل الدخول</span></div>
          <p class="boot-secure">بياناتك آمنة ومشفرة بالكامل</p>
          <button id="boot-retry" type="button">إعادة المحاولة</button>
        </section>
      </main>
      <aside class="boot-brand-side">
        <div class="boot-brand-copy">
          <h1>مساحة عمل واحدة.<br>إنجاز أوضح.</h1>
          <p>نظّم مهامك، تابع فريقك، وأنجز أعمالك اليومية بسهولة من أي جهاز.</p>
        </div>
      </aside>
    </div>
  </div>

  <script>
    function removeBootStatus() {
      const status = document.getElementById('boot-status');
      if (status) status.remove();
    }

    // Flutter's first frame can be only a background layer on slower WebKit
    // renderers. Keep the HTML cover until SplashRouter confirms that the
    // actual destination screen has completed a frame.
    window.addEventListener('neotask-app-ready', removeBootStatus);

    window.addEventListener('flutter-first-frame', function () {
      // Fail-safe for startup-error screens or an unexpected route that cannot
      // send the explicit ready event. This must not be the normal hide path.
      setTimeout(removeBootStatus, 15000);
    });

    window.addEventListener('error', function (event) {
      const message = document.getElementById('boot-message');
      if (message) message.textContent = 'تعذّر تحميل التطبيق، أعد فتح الصفحة';
      console.error('NeoTask startup error:', event.error || event.message);
    });

    window.addEventListener('unhandledrejection', function (event) {
      const message = document.getElementById('boot-message');
      if (message) message.textContent = 'تعذّر تحميل التطبيق، أعد المحاولة';
      console.error('NeoTask startup rejection:', event.reason);
    });

    document.getElementById('boot-retry').addEventListener('click', function () {
      window.location.reload();
    });

    setTimeout(function () {
      const message = document.getElementById('boot-message');
      if (message && document.getElementById('boot-status')) {
        message.textContent = 'تعذّر إكمال التشغيل';
        const spinner = document.querySelector('#boot-status .spinner');
        const retry = document.getElementById('boot-retry');
        if (spinner) spinner.style.display = 'none';
        if (retry) retry.style.display = 'block';
      }
    }, 15000);

    const NEO_TASK_BUILD_ID = '20260801-5';

    // Retire Flutter's legacy offline-first worker. Unregistering a worker
    // does not release the page it currently controls until the next
    // navigation. Starting Flutter in that half-migrated page can mix a new
    // index.html with stale runtime files and leave iOS on a white canvas.
    // When a legacy worker still controls this page, migrate once and reload
    // with a build id. Firebase/Auth/Firestore browser storage is untouched.
    async function retireLegacyFlutterWorker() {
      if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
        return false;
      }

      let alreadyMigrated = false;
      try {
        alreadyMigrated =
          localStorage.getItem('neotask-sw-migration') === NEO_TASK_BUILD_ID;
      } catch (_) {}
      if (alreadyMigrated) return false;

      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations
        .filter((registration) => registration.scope.startsWith(location.origin))
        .map((registration) => registration.unregister()));

      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names
          .filter((name) => name.startsWith('flutter-'))
          .map((name) => caches.delete(name)));
      }

      try {
        localStorage.setItem('neotask-sw-migration', NEO_TASK_BUILD_ID);
      } catch (_) {}
      return true;
    }

    async function startFlutter() {
      let mustReload = false;
      try {
        // Normal refreshes skip this completely. It only runs once while an
        // old Flutter worker still controls the page.
        mustReload = await retireLegacyFlutterWorker();
      } catch (error) {
        // Cache cleanup must never become a new startup blocker. Loading the
        // network build is still safer than leaving the user on the spinner.
        console.warn('Legacy Flutter cache cleanup failed:', error);
      }

      const currentUrl = new URL(window.location.href);
      if (mustReload) {
        const message = document.getElementById('boot-message');
        if (message) message.textContent = 'جارٍ تحديث NeoTask';
        currentUrl.searchParams.set('_build', NEO_TASK_BUILD_ID);
        window.location.replace(currentUrl.toString());
        return;
      }

      const script = document.createElement('script');
      script.src = `flutter_bootstrap.js?v=${NEO_TASK_BUILD_ID}`;
      script.async = true;
      script.onerror = function () {
        const message = document.getElementById('boot-message');
        const retry = document.getElementById('boot-retry');
        if (message) message.textContent = 'تعذّر تحميل التطبيق';
        if (retry) retry.style.display = 'block';
      };
      document.body.appendChild(script);
    }

    startFlutter();
  </script>
</body>
</html>
