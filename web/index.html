<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NeoTask - Manager & Employee Task Management Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NeoTask">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preload" as="image" href="assets/assets/images/neotask_brand_full.png?v=20260801-7">

  <title>NeoTask</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    #boot-status {
      position: fixed;
      inset: 0;
      color: #1B3A6B;
      background: #f6f8fb;
      z-index: 9999;
    }
    .boot-shell {
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(420px, 56%) minmax(360px, 44%);
      direction: ltr;
    }
    .boot-form-side {
      display: grid;
      place-items: center;
      padding: 40px;
      direction: rtl;
    }
    .boot-card {
      width: min(100%, 430px);
      box-sizing: border-box;
      padding: 34px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(17, 37, 68, .12);
    }
    .boot-card img {
      display: block;
      width: 190px;
      height: 76px;
      object-fit: contain;
      margin: 0 auto 26px;
    }
    .boot-title {
      margin: 0 0 7px;
      color: #112946;
      font-size: 25px;
      font-weight: 800;
      text-align: center;
    }
    .boot-subtitle {
      margin: 0 0 25px;
      color: #718096;
      font-size: 14px;
      text-align: center;
    }
    .boot-label {
      display: block;
      margin: 0 3px 7px;
      color: #506176;
      font-size: 12px;
      font-weight: 700;
    }
    .boot-field {
      position: relative;
      height: 50px;
      margin-bottom: 16px;
      border: 1px solid #dce3ea;
      border-radius: 13px;
      background: #f9fbfc;
      overflow: hidden;
    }
    .boot-field input {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 0 15px;
      border: 0;
      outline: 0;
      color: #112946;
      background: transparent;
      font: inherit;
      font-size: 15px;
      text-align: right;
    }
    .boot-field input::placeholder { color: #a7b0bc; }
    .boot-field input:focus { box-shadow: inset 0 0 0 2px rgba(27, 58, 107, .18); }
    .boot-password input { padding-left: 52px; }
    .boot-password-toggle {
      position: absolute;
      inset: 0 auto 0 0;
      width: 48px;
      border: 0;
      color: #718096;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .boot-action {
      width: 100%;
      border: 0;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 7px;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #15355c, #315c79);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .boot-action:disabled { cursor: wait; opacity: .82; }
    .boot-action .spinner { display: none; }
    .boot-action.is-loading .spinner { display: block; }
    .boot-error {
      min-height: 20px;
      margin: 10px 0 0;
      color: #c94c4c;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }
    .boot-secure {
      margin: 16px 0 0;
      color: #7a8796;
      font-size: 11px;
      text-align: center;
    }
    .boot-brand-side {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 64px;
      color: #fff;
      background: linear-gradient(145deg, #0f2948 0%, #163a61 68%, #214c69 100%);
      direction: rtl;
    }
    .boot-brand-side::before {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      left: -170px;
      bottom: -170px;
      border-radius: 50%;
      background: rgba(111, 215, 190, .16);
    }
    .boot-brand-copy { position: relative; max-width: 440px; }
    .boot-brand-copy h1 {
      margin: 0 0 14px;
      font-size: clamp(29px, 3vw, 46px);
      line-height: 1.35;
    }
    .boot-brand-copy p {
      margin: 0;
      color: rgba(255,255,255,.74);
      font-size: 16px;
      line-height: 1.8;
    }
    #boot-status .spinner {
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #boot-message { font: inherit; }
    #boot-retry {
      display: none;
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      padding: 11px 22px;
      color: #fff;
      background: #1B3A6B;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 899px) {
      #boot-status { overflow: auto; }
      .boot-shell {
        min-height: 100%;
        grid-template-columns: 1fr;
        grid-template-rows: 210px auto;
      }
      .boot-brand-side {
        grid-row: 1;
        justify-content: center;
        padding: 30px 24px 54px;
        text-align: center;
      }
      .boot-brand-copy h1 { font-size: 25px; }
      .boot-brand-copy p { font-size: 13px; }
      .boot-form-side {
        grid-row: 2;
        place-items: start center;
        padding: 0 18px 30px;
      }
      .boot-card {
        margin-top: -34px;
        padding: 27px 22px;
        border-radius: 23px;
      }
      .boot-card img { width: 170px; height: 66px; margin-bottom: 18px; }
      .boot-title { font-size: 22px; }
    }
    @media (max-height: 650px) and (max-width: 899px) {
      .boot-shell { grid-template-rows: 150px auto; }
      .boot-brand-side { padding-top: 22px; }
      .boot-brand-copy p { display: none; }
      .boot-card { padding-block: 20px; }
      .boot-card img { height: 52px; margin-bottom: 10px; }
      .boot-subtitle { margin-bottom: 15px; }
      .boot-field { height: 44px; margin-bottom: 10px; }
      .boot-action { height: 44px; }
      .boot-secure { margin-top: 10px; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-status" role="status" aria-live="polite" aria-busy="true">
    <div class="boot-shell">
      <main class="boot-form-side">
        <section class="boot-card">
          <img src="assets/assets/images/neotask_brand_full.png?v=20260801-7" alt="NeoTask">
          <h2 class="boot-title">مرحبًا بعودتك</h2>
          <p class="boot-subtitle">سجّل الدخول للوصول إلى مساحة عملك</p>
          <form id="boot-login" novalidate>
            <label class="boot-label" for="boot-employee-number">الرقم الوظيفي</label>
            <div class="boot-field">
              <input id="boot-employee-number" name="employeeNumber" type="text" inputmode="text" autocomplete="username" placeholder="مثال: 10234" aria-label="الرقم الوظيفي" required>
            </div>
            <label class="boot-label" for="boot-password">الرقم السري</label>
            <div class="boot-field boot-password">
              <input id="boot-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" aria-label="الرقم السري" required>
              <button id="boot-password-toggle" class="boot-password-toggle" type="button" aria-label="إظهار الرقم السري">إظهار</button>
            </div>
            <button id="boot-submit" class="boot-action" type="submit"><span class="spinner"></span><span id="boot-message">تسجيل الدخول</span></button>
            <p id="boot-error" class="boot-error" role="alert"></p>
          </form>
          <p class="boot-secure">بياناتك آمنة ومشفرة بالكامل</p>
          <button id="boot-retry" type="button">إعادة المحاولة</button>
        </section>
      </main>
      <aside class="boot-brand-side">
        <div class="boot-brand-copy">
          <h1>مساحة عمل واحدة.<br>إنجاز أوضح.</h1>
          <p>نظّم مهامك، تابع فريقك، وأنجز أعمالك اليومية بسهولة من أي جهاز.</p>
        </div>
      </aside>
    </div>
  </div>

  <script>
    function removeBootStatus() {
      const status = document.getElementById('boot-status');
      if (status) status.remove();
    }

    // Flutter's first frame can be only a background layer on slower WebKit
    // renderers. Keep the HTML cover until SplashRouter confirms that the
    // actual destination screen has completed a frame.
    window.addEventListener('neotask-app-ready', removeBootStatus);

    // A first Flutter frame can still be a blank CanvasKit surface on WebKit.
    // Only trust it when the instant HTML auth route is unavailable, or when
    // an invite intentionally needs to hand off to Flutter immediately.
    window.__neotaskAllowFirstFrameFallback = false;
    window.addEventListener('flutter-first-frame', function () {
      if (window.__neotaskAllowFirstFrameFallback) {
        requestAnimationFrame(removeBootStatus);
      }
    });

    window.addEventListener('error', function (event) {
      const message = document.getElementById('boot-message');
      if (message) message.textContent = 'تعذّر تحميل التطبيق، أعد فتح الصفحة';
      console.error('NeoTask startup error:', event.error || event.message);
    });

    window.addEventListener('unhandledrejection', function (event) {
      const message = document.getElementById('boot-message');
      if (message) message.textContent = 'تعذّر تحميل التطبيق، أعد المحاولة';
      console.error('NeoTask startup rejection:', event.reason);
    });

    document.getElementById('boot-retry').addEventListener('click', function () {
      window.location.reload();
    });

    const NEO_TASK_BUILD_ID = '20260801-7';
    let flutterStarted = false;

    function setBootLoading(loading, text) {
      const action = document.getElementById('boot-submit');
      const message = document.getElementById('boot-message');
      if (action) {
        action.disabled = loading;
        action.classList.toggle('is-loading', loading);
      }
      if (message && text) message.textContent = text;
    }

    function setBootError(text) {
      const error = document.getElementById('boot-error');
      if (error) error.textContent = text || '';
    }

    // Retire Flutter's legacy offline-first worker. Unregistering a worker
    // does not release the page it currently controls until the next
    // navigation. Starting Flutter in that half-migrated page can mix a new
    // index.html with stale runtime files and leave iOS on a white canvas.
    // When a legacy worker still controls this page, migrate once and reload
    // with a build id. Firebase/Auth/Firestore browser storage is untouched.
    async function retireLegacyFlutterWorker() {
      if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) {
        return false;
      }

      let alreadyMigrated = false;
      try {
        alreadyMigrated =
          localStorage.getItem('neotask-sw-migration') === NEO_TASK_BUILD_ID;
      } catch (_) {}
      if (alreadyMigrated) return false;

      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations
        .filter((registration) => registration.scope.startsWith(location.origin))
        .map((registration) => registration.unregister()));

      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names
          .filter((name) => name.startsWith('flutter-'))
          .map((name) => caches.delete(name)));
      }

      try {
        localStorage.setItem('neotask-sw-migration', NEO_TASK_BUILD_ID);
      } catch (_) {}
      return true;
    }

    async function startFlutter() {
      if (flutterStarted) return;
      flutterStarted = true;
      let mustReload = false;
      try {
        // Normal refreshes skip this completely. It only runs once while an
        // old Flutter worker still controls the page.
        mustReload = await retireLegacyFlutterWorker();
      } catch (error) {
        // Cache cleanup must never become a new startup blocker. Loading the
        // network build is still safer than leaving the user on the spinner.
        console.warn('Legacy Flutter cache cleanup failed:', error);
      }

      const currentUrl = new URL(window.location.href);
      if (mustReload) {
        const message = document.getElementById('boot-message');
        if (message) message.textContent = 'جارٍ تحديث NeoTask';
        currentUrl.searchParams.set('_build', NEO_TASK_BUILD_ID);
        window.location.replace(currentUrl.toString());
        return;
      }

      const script = document.createElement('script');
      script.src = `flutter_bootstrap.js?v=${NEO_TASK_BUILD_ID}`;
      script.async = true;
      script.onerror = function () {
        const message = document.getElementById('boot-message');
        const retry = document.getElementById('boot-retry');
        if (message) message.textContent = 'تعذّر تحميل التطبيق';
        if (retry) retry.style.display = 'block';
      };
      document.body.appendChild(script);
    }

    async function startInstantLogin() {
      const inviteToken = new URL(window.location.href).searchParams.get('invite');
      if (inviteToken) {
        window.__neotaskAllowFirstFrameFallback = true;
        setBootLoading(true, 'جارٍ فتح الدعوة');
        await startFlutter();
        return;
      }

      const form = document.getElementById('boot-login');
      const employeeInput = document.getElementById('boot-employee-number');
      const passwordInput = document.getElementById('boot-password');
      const passwordToggle = document.getElementById('boot-password-toggle');
      let resolveAuth;
      let rejectAuth;
      const authReady = new Promise(function (resolve, reject) {
        resolveAuth = resolve;
        rejectAuth = reject;
      });
      authReady.catch(function () {});

      passwordToggle.addEventListener('click', function () {
        const reveal = passwordInput.type === 'password';
        passwordInput.type = reveal ? 'text' : 'password';
        passwordToggle.textContent = reveal ? 'إخفاء' : 'إظهار';
        passwordToggle.setAttribute('aria-label', reveal ? 'إخفاء الرقم السري' : 'إظهار الرقم السري');
      });

      // Attach before importing Firebase so the visible form is never a dead
      // control, even on a very slow mobile connection.
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        setBootError('');

        const employeeNumber = employeeInput.value.trim();
        const password = passwordInput.value;
        const cleaned = employeeNumber.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!cleaned || !password) {
          setBootError('أدخل الرقم الوظيفي والرقم السري');
          return;
        }

        setBootLoading(true, 'جارٍ التحقق');
        try {
          const { auth, authSdk } = await authReady;
          await authSdk.signInWithEmailAndPassword(
            auth,
            `${cleaned}@neotask.local`,
            password,
          );
          setBootLoading(true, 'جارٍ فتح مساحة العمل');
          await startFlutter();
        } catch (error) {
          const code = error && error.code ? error.code : '';
          const invalidCredential = code === 'auth/invalid-credential' ||
            code === 'auth/user-not-found' ||
            code === 'auth/wrong-password' ||
            code === 'auth/invalid-email';
          setBootError(invalidCredential
            ? 'الرقم الوظيفي أو الرقم السري غير صحيح'
            : code === 'auth/too-many-requests'
              ? 'محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة'
              : 'تعذّر الاتصال بخدمة الدخول، أعد المحاولة');
          setBootLoading(false, 'تسجيل الدخول');
        }
      });

      try {
        const [{ initializeApp }, authSdk] = await Promise.all([
          // firebase-auth imports this exact unversioned module internally.
          // Keeping both URLs identical prevents two Firebase component
          // registries from being created in Safari/Chrome module caches.
          import('./firebase-sdk/firebase-app.js'),
          import('./firebase-sdk/firebase-auth.js'),
        ]);
        const app = initializeApp({
          apiKey: 'AIzaSyAH4nvOmEuBXlYmSgTvVedEyGGqcVhXcZ4',
          appId: '1:4737825788:web:13f3dc6bf2b2bda6c8d079',
          messagingSenderId: '4737825788',
          projectId: 'neotask1-ff5a4',
          authDomain: 'neotask1-ff5a4.firebaseapp.com',
          storageBucket: 'neotask1-ff5a4.firebasestorage.app',
        });
        const auth = authSdk.getAuth(app);
        resolveAuth({ auth, authSdk });
        authSdk.onAuthStateChanged(auth, function (user) {
          if (!user || flutterStarted) return;
          setBootLoading(true, 'جارٍ فتح مساحة العمل');
          startFlutter();
        });
        employeeInput.focus();
      } catch (error) {
        console.error('NeoTask instant login failed:', error);
        rejectAuth(error);
        window.__neotaskAllowFirstFrameFallback = true;
        setBootError('تعذّر تجهيز الدخول السريع، جارٍ فتح التطبيق');
        setBootLoading(true, 'جارٍ فتح التطبيق');
        await startFlutter();
      }
    }

    startInstantLogin();
  </script>
</body>
</html>
