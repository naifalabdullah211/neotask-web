<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NeoTask - Manager & Employee Task Management Platform">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NeoTask">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>NeoTask</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    #boot-status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      color: #1B3A6B;
      background: #f5f7fa;
      z-index: 9999;
    }
    #boot-status img {
      width: 92px;
      height: 92px;
      object-fit: contain;
    }
    #boot-status .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(27, 58, 107, 0.18);
      border-top-color: #1B3A6B;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #boot-message {
      font-size: 15px;
      font-weight: 600;
    }
    #boot-retry {
      display: none;
      border: 0;
      border-radius: 12px;
      padding: 11px 22px;
      color: #fff;
      background: #1B3A6B;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot-status" role="status" aria-live="polite">
    <img src="assets/assets/images/neotask_logo.png" alt="NeoTask">
    <div class="spinner"></div>
    <div id="boot-message">جارٍ تشغيل NeoTask</div>
    <button id="boot-retry" type="button">إعادة المحاولة</button>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const status = document.getElementById('boot-status');
      if (status) status.remove();
    });

    window.addEventListener('error', function (event) {
      const message = document.getElementById('boot-message');
      if (message) message.textContent = 'تعذّر تحميل التطبيق، أعد فتح الصفحة';
      console.error('NeoTask startup error:', event.error || event.message);
    });

    window.addEventListener('unhandledrejection', function (event) {
      const message = document.getElementById('boot-message');
      if (message) message.textContent = 'تعذّر تحميل التطبيق، أعد المحاولة';
      console.error('NeoTask startup rejection:', event.reason);
    });

    document.getElementById('boot-retry').addEventListener('click', function () {
      window.location.reload();
    });

    setTimeout(function () {
      const message = document.getElementById('boot-message');
      if (message && document.getElementById('boot-status')) {
        message.textContent = 'تعذّر إكمال التشغيل';
        const spinner = document.querySelector('#boot-status .spinner');
        const retry = document.getElementById('boot-retry');
        if (spinner) spinner.style.display = 'none';
        if (retry) retry.style.display = 'block';
      }
    }, 8000);

    const NEO_TASK_BUILD_ID = '20260801-3';

    // Retire Flutter's legacy offline-first worker. Unregistering a worker
    // does not release the page it currently controls until the next
    // navigation. Starting Flutter in that half-migrated page can mix a new
    // index.html with stale runtime files and leave iOS on a white canvas.
    // When a legacy worker still controls this page, migrate once and reload
    // with a build id. Firebase/Auth/Firestore browser storage is untouched.
    async function clearLegacyFlutterCache() {
      let controlledByLegacyWorker = false;

      const cleanup = async function () {
        if ('serviceWorker' in navigator) {
          controlledByLegacyWorker = Boolean(navigator.serviceWorker.controller);
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations
            .filter((registration) => registration.scope.startsWith(location.origin))
            .map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          const flutterCaches = new Set([
            'flutter-app-cache',
            'flutter-temp-cache',
            'flutter-app-manifest'
          ]);
          await Promise.all(names
            .filter((name) => flutterCaches.has(name))
            .map((name) => caches.delete(name)));
        }
      };

      await Promise.race([
        cleanup(),
        new Promise((resolve) => setTimeout(resolve, 1500))
      ]);

      return controlledByLegacyWorker;
    }

    async function startFlutter() {
      let mustReload = false;
      try {
        mustReload = await clearLegacyFlutterCache();
      } catch (error) {
        // Cache cleanup must never become a new startup blocker. Loading the
        // network build is still safer than leaving the user on the spinner.
        console.warn('Legacy Flutter cache cleanup failed:', error);
      }

      const currentUrl = new URL(window.location.href);
      if (mustReload && currentUrl.searchParams.get('_build') !== NEO_TASK_BUILD_ID) {
        const message = document.getElementById('boot-message');
        if (message) message.textContent = 'جارٍ تحديث NeoTask';
        currentUrl.searchParams.set('_build', NEO_TASK_BUILD_ID);
        window.location.replace(currentUrl.toString());
        return;
      }

      const script = document.createElement('script');
      script.src = `flutter_bootstrap.js?v=${NEO_TASK_BUILD_ID}`;
      script.async = true;
      script.onerror = function () {
        const message = document.getElementById('boot-message');
        const retry = document.getElementById('boot-retry');
        if (message) message.textContent = 'تعذّر تحميل التطبيق';
        if (retry) retry.style.display = 'block';
      };
      document.body.appendChild(script);
    }

    startFlutter();
  </script>
</body>
</html>
