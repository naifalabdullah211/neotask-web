name: Apply NeoTask Workspace Refresh Phase 5

on:
  push:
    branches: [main]
    paths:
      - 'tool/refresh_workspace_phase5.py'
      - 'tool/add_workspace_phase5_translations.py'
      - '.github/workflows/apply-workspace-refresh-phase5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neotask-workspace-refresh-phase5
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Apply meetings and import refresh
        run: |
          python tool/refresh_workspace_phase5.py
          python tool/add_workspace_phase5_translations.py
          python tool/dedupe_i18n_keys.py
          dart format \
            lib/screens/shared/meetings_screen.dart \
            lib/screens/manager/bulk_import_screen.dart \
            lib/l10n/app_i18n.dart
      - name: Verify Flutter
        run: |
          flutter pub get
          flutter test test/runtime_i18n_templates_test.dart
          flutter test test/workflow_features_test.dart
          flutter build web --release --pwa-strategy=none
      - name: Commit verified phase five refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/screens/shared/meetings_screen.dart \
            lib/screens/manager/bulk_import_screen.dart \
            lib/l10n/app_i18n.dart
          if git diff --cached --quiet; then
            echo 'No phase-five changes to commit'
            exit 0
          fi
          git commit -m 'Refresh NeoTask meetings and bulk import workspaces'
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
