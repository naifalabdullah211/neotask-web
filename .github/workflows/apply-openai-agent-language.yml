name: Apply NeoTask OpenAI Agent Language

on:
  push:
    branches: [main]
    paths:
      - 'tool/patch_openai_agent_language.py'
      - '.github/workflows/apply-openai-agent-language.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neotask-openai-agent-language
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Harden literal regex replacement helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tool/patch_openai_agent_language.py')
          s = p.read_text(encoding='utf-8')
          old = """def regex_once(pattern: str, replacement: str, label: str) -> None:
              global text
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count == 0:
                  if replacement in text:
                      return
                  raise SystemExit(f'missing regex target: {label}')
              text = updated
          """
          new = """def regex_once(pattern: str, replacement: str, label: str) -> None:
              global text
              compiled = re.compile(pattern, re.S)
              match = compiled.search(text)
              if match is None:
                  if replacement in text:
                      return
                  raise SystemExit(f'missing regex target: {label}')
              text = text[:match.start()] + replacement + text[match.end():]
          """
          if old not in s:
              raise SystemExit('regex helper target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply bilingual agent patch
        run: python tool/patch_openai_agent_language.py
      - name: Verify Node syntax
        run: |
          node --check api/openai-agent.js
          node --check api/multi-agent.js
      - name: Run agent unit tests
        run: node --test api/agent.test.js
      - name: Commit verified backend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/openai-agent.js tool/patch_openai_agent_language.py
          git commit -m 'Make NeoTask AI agents fully bilingual' || true
          git push || true
