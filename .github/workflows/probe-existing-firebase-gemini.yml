name: Probe NeoTask Existing Firebase Gemini Access

on:
  push:
    branches: [main]
    paths:
      - 'tool/probe_existing_firebase_gemini.cjs'
      - '.github/workflows/probe-existing-firebase-gemini.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe existing Firebase web key against Gemini Developer API
        run: node tool/probe_existing_firebase_gemini.cjs
