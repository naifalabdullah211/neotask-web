name: Verify NeoTask Multi-Agent AI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-multi-agent-ai.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production AI endpoint
        run: |
          set -euo pipefail
          URL='https://neotask-9kramm8id-naifalabdullah211s-projects.vercel.app/api/multi-agent'
          STATUS=$(curl -sS -o /tmp/ai-health.json -w '%{http_code}' "$URL" || true)
          printf 'Checked: %s\nURL: %s\nHTTP: %s\nBody:\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$URL" "$STATUS" > ai-health-check.txt
          cat /tmp/ai-health.json >> ai-health-check.txt || true
          cat ai-health-check.txt
      - name: Record result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ai-health-check.txt
          git commit -m 'chore: record NeoTask multi-agent AI health [skip ci]' || true
          git push || true
