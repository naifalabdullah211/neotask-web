name: Apply NeoTask Workspace Refresh Phase 3

on:
  push:
    branches: [main]
    paths:
      - 'tool/refresh_workspace_phase3.py'
      - 'tool/add_workspace_phase3_translations.py'
      - '.github/workflows/apply-workspace-refresh-phase3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neotask-workspace-refresh-phase3
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Apply phase three refresh
        run: |
          python tool/refresh_workspace_phase3.py
          python tool/add_workspace_phase3_translations.py
          python tool/dedupe_i18n_keys.py
      - name: Format changed Dart files
        run: |
          dart format \
            lib/screens/manager/luxury_manager_dashboard.dart \
            lib/screens/manager/poll_report_screen.dart \
            lib/screens/shared/goal_detail_screen.dart \
            lib/screens/public/public_form_screen.dart \
            lib/screens/shared/chat_thread_screen.dart \
            lib/l10n/app_i18n.dart
      - name: Verify Flutter
        run: |
          flutter pub get
          flutter test test/workflow_features_test.dart
          flutter build web --release --pwa-strategy=none
      - name: Commit verified phase three refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/screens/manager/luxury_manager_dashboard.dart \
            lib/screens/manager/poll_report_screen.dart \
            lib/screens/shared/goal_detail_screen.dart \
            lib/screens/public/public_form_screen.dart \
            lib/screens/shared/chat_thread_screen.dart \
            lib/l10n/app_i18n.dart
          if git diff --cached --quiet; then
            echo 'No phase-three changes to commit'
            exit 0
          fi
          git commit -m 'Harden NeoTask premium workspaces and bilingual runtime copy'
          git reset --hard HEAD
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
