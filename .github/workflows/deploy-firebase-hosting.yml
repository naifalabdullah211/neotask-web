name: Deploy NeoTask to Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy-error.log'
      - 'hosting-sites.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neotask-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for embedded secrets and executable HTML sinks
        run: node scripts/security_check.js

      - name: Test Cloud Functions security controls
        run: |
          set -euo pipefail
          npm ci --prefix functions
          node --check functions/index.js
          npm test --prefix functions

      - name: Prepare deployment log
        run: |
          : > deploy-error.log
          echo "NeoTask deployment diagnostic" >> deploy-error.log
          echo "Commit: $GITHUB_SHA" >> deploy-error.log
          echo "Started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deploy-error.log

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a deploy-error.log

      - name: Test workflow models
        run: |
          set -o pipefail
          flutter test test/workflow_features_test.dart 2>&1 | tee -a deploy-error.log

      - name: Build Flutter web
        run: |
          set -o pipefail
          flutter build web --release --pwa-strategy=none 2>&1 | tee -a deploy-error.log

      - name: Install neutral Service Worker cleanup
        run: |
          set -euo pipefail
          cp web/flutter_service_worker.js build/web/flutter_service_worker.js
          test -s build/web/flutter_service_worker.js
          grep -q 'NEOTASK_SERVICE_WORKER_NEUTRAL_20260817_2' build/web/flutter_service_worker.js

      - name: Decode Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEOTASK1_FF5A4 }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          python - <<'PY'
          import json, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'firebase-service-account.json')
          with open(p, encoding='utf-8') as f:
              d = json.load(f)
          if d.get('project_id') != 'neotask1-ff5a4':
              raise SystemExit('Firebase project mismatch')
          print('Firebase credential valid')
          PY
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase deployment tools
        run: |
          set -o pipefail
          npm install --global firebase-tools google-auth-library 2>&1 | tee -a deploy-error.log

      - name: Test Firestore manager bootstrap rules
        run: |
          set -o pipefail
          firebase emulators:exec --only firestore \
            "npm run test:rules --prefix functions" \
            --project neotask1-ff5a4 2>&1 | tee -a deploy-error.log

      - name: Provision one-time manager setup proof
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          private_key_file="$RUNNER_TEMP/firebase-service-account-private-key.pem"
          cipher_file="$RUNNER_TEMP/manager-setup-key.bin"
          plaintext_file="$RUNNER_TEMP/manager-setup-key.txt"
          trap 'rm -f "$private_key_file" "$cipher_file" "$plaintext_file"' EXIT

          python - <<'PY'
          import json, os
          source = os.path.join(os.environ['RUNNER_TEMP'], 'firebase-service-account.json')
          target = os.path.join(os.environ['RUNNER_TEMP'], 'firebase-service-account-private-key.pem')
          with open(source, encoding='utf-8') as f:
              credential = json.load(f)
          with open(target, 'w', encoding='utf-8') as f:
              f.write(credential['private_key'])
          os.chmod(target, 0o600)
          PY

          base64 --decode .github/manager-setup-key.enc > "$cipher_file"
          openssl pkeyutl -decrypt \
            -inkey "$private_key_file" \
            -in "$cipher_file" \
            -out "$plaintext_file" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          chmod 600 "$plaintext_file"

          export NODE_PATH="$(npm root -g)"
          MANAGER_SETUP_KEY_FILE="$plaintext_file" node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const {GoogleAuth} = require('google-auth-library');

          async function provisionProof() {
            const projectId = 'neotask1-ff5a4';
            const projectName = `projects/${projectId}`;
            const databaseRoot = `${projectName}/databases/(default)/documents`;
            const lockUrl = `https://firestore.googleapis.com/v1/${databaseRoot}/system/manager_lock`;
            const proofUrl = `https://firestore.googleapis.com/v1/${databaseRoot}/system/manager_bootstrap`;
            const auth = new GoogleAuth({
              keyFile: process.env.GOOGLE_APPLICATION_CREDENTIALS,
              scopes: ['https://www.googleapis.com/auth/cloud-platform'],
            });
            const client = await auth.getClient();

            try {
              await client.request({url: lockUrl});
              console.log('Manager already exists; setup proof not provisioned');
              return;
            } catch (error) {
              if (error.response?.status !== 404) throw error;
            }

            const value = fs.readFileSync(process.env.MANAGER_SETUP_KEY_FILE);
            const proofHash = crypto.createHash('sha256').update(value).digest('hex');
            await client.request({
              url: proofUrl,
              method: 'PATCH',
              data: {
                fields: {
                  proofHash: {stringValue: proofHash},
                  createdAt: {timestampValue: new Date().toISOString()},
                },
              },
            });
            console.log('One-time manager setup proof provisioned');
          }

          provisionProof().catch((error) => {
            const details = error.response?.data || error.message || error;
            console.error('Manager setup proof provisioning failed:', JSON.stringify(details));
            process.exit(1);
          });
          NODE

      - name: List actual Firebase Hosting sites
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          firebase hosting:sites:list --project neotask1-ff5a4 --json > hosting-sites.txt
          cat hosting-sites.txt

      - name: Deploy Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          NODE_PATH: ${{ runner.tool_cache }}/node
        run: |
          set -euo pipefail
          export NODE_PATH="$(npm root -g)"
          node <<'NODE' 2>&1 | tee -a deploy-error.log
          const fs = require('fs');
          const {GoogleAuth} = require('google-auth-library');

          async function deployRules() {
            const projectId = 'neotask1-ff5a4';
            const projectName = `projects/${projectId}`;
            const releaseName = `${projectName}/releases/cloud.firestore`;
            const auth = new GoogleAuth({
              keyFile: process.env.GOOGLE_APPLICATION_CREDENTIALS,
              scopes: ['https://www.googleapis.com/auth/cloud-platform'],
            });
            const client = await auth.getClient();
            const source = fs.readFileSync('firestore.rules', 'utf8');

            const rulesetResponse = await client.request({
              url: `https://firebaserules.googleapis.com/v1/${projectName}/rulesets`,
              method: 'POST',
              data: {
                source: {
                  files: [{name: 'firestore.rules', content: source}],
                },
              },
            });
            const rulesetName = rulesetResponse.data.name;
            if (!rulesetName) throw new Error('Rules API did not return a ruleset name');

            await client.request({
              url: `https://firebaserules.googleapis.com/v1/${releaseName}`,
              method: 'PATCH',
              data: {
                release: {name: releaseName, rulesetName},
                updateMask: 'rulesetName',
              },
            });
            console.log(`Firestore rules released: ${rulesetName}`);
          }

          deployRules().catch((error) => {
            const details = error.response?.data || error.message || error;
            console.error('Firestore rules deployment failed:', JSON.stringify(details));
            process.exit(1);
          });
          NODE

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -o pipefail
          firebase deploy --only hosting --project neotask1-ff5a4 --non-interactive 2>&1 | tee -a deploy-error.log

      - name: Save actual Hosting site list
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hosting-sites.txt || true
          git commit -m "chore: record Firebase Hosting site list [skip ci]" || true
          git push || true

      - name: Save failure diagnostic to repository
        if: failure()
        run: |
          echo "Failed: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deploy-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f deploy-error.log
          git commit -m "chore: save NeoTask deployment failure log [skip ci]" || true
          git push || true

