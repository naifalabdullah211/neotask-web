name: Deploy NeoTask to Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy-error.log'
      - 'hosting-sites.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neotask-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment log
        run: |
          : > deploy-error.log
          echo "NeoTask deployment diagnostic" >> deploy-error.log
          echo "Commit: $GITHUB_SHA" >> deploy-error.log
          echo "Started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deploy-error.log

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get 2>&1 | tee -a deploy-error.log

      - name: Build Flutter web
        run: flutter build web --release 2>&1 | tee -a deploy-error.log

      - name: Decode Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEOTASK1_FF5A4 }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/firebase-service-account.json"
          python - <<'PY'
          import json, os, sys
          p = os.path.join(os.environ['RUNNER_TEMP'], 'firebase-service-account.json')
          with open(p, encoding='utf-8') as f:
              d = json.load(f)
          if d.get('project_id') != 'neotask1-ff5a4':
              raise SystemExit('Firebase project mismatch')
          print('Firebase credential valid')
          PY
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools 2>&1 | tee -a deploy-error.log

      - name: List actual Firebase Hosting sites
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          firebase hosting:sites:list --project neotask1-ff5a4 --json > hosting-sites.txt
          cat hosting-sites.txt

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project neotask1-ff5a4 --non-interactive 2>&1 | tee -a deploy-error.log

      - name: Save actual Hosting site list
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hosting-sites.txt || true
          git commit -m "chore: record Firebase Hosting site list [skip ci]" || true
          git push || true

      - name: Save failure diagnostic to repository
        if: failure()
        run: |
          echo "Failed: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deploy-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f deploy-error.log
          git commit -m "chore: save NeoTask deployment failure log [skip ci]" || true
          git push || true
