name: Deploy NeoTask to Firebase Hosting

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy-error.log'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neotask-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment log
        run: |
          : > deploy-error.log
          echo "NeoTask deployment diagnostic" >> deploy-error.log
          echo "Commit: $GITHUB_SHA" >> deploy-error.log
          echo "Started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deploy-error.log

      - name: Set up Flutter
        id: flutter_setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Record Flutter version
        run: flutter --version 2>&1 | tee -a deploy-error.log

      - name: Install Flutter dependencies
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a deploy-error.log

      - name: Build Flutter web
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee -a deploy-error.log

      - name: Write Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NEOTASK1_FF5A4 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ERROR: Firebase service-account secret is missing" | tee -a deploy-error.log
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          python - <<'PY'
          import json, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'firebase-service-account.json')
          with open(p, encoding='utf-8') as f:
              data = json.load(f)
          print('Firebase service account JSON validated for project:', data.get('project_id'))
          PY

      - name: Install Firebase CLI
        run: |
          set -o pipefail
          npm install --global firebase-tools 2>&1 | tee -a deploy-error.log

      - name: Deploy Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -o pipefail
          firebase deploy --only hosting --project neotask1-ff5a4 --non-interactive 2>&1 | tee -a deploy-error.log

      - name: Save failure diagnostic to repository
        if: failure()
        run: |
          echo "Failed: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> deploy-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-error.log
          git commit -m "chore: save NeoTask deployment failure log [skip ci]" || true
          git push

      - name: Remove stale diagnostic after success
        if: success()
        run: |
          if [ -f deploy-error.log ] && git ls-files --error-unmatch deploy-error.log >/dev/null 2>&1; then
            git rm deploy-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: clear NeoTask deployment failure log [skip ci]" || true
            git push
          fi
