name: Cloudflare deployment preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check-cloudflare-access:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository Cloudflare credentials
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=Cloudflare deployment credentials are available" >> "$GITHUB_OUTPUT"
          else
            echo "state=error" >> "$GITHUB_OUTPUT"
            echo "description=Cloudflare deployment credentials are missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish safe preflight status
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.access.outputs.state }}
          DESCRIPTION: ${{ steps.access.outputs.description }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$(jq -nc --arg state "$STATE" --arg description "$DESCRIPTION" \
              '{state:$state,context:"Cloudflare deployment access",description:$description}')"
